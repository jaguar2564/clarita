<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Clarita busca a Any</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      background: #17243a;
      color: #f6ead6;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 960px;
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      background: #8ccff2;
    }

    .help {
      margin: 0;
      font-size: 14px;
      opacity: 0.75;
      text-align: center;
    }

    /* Controles táctiles: solo en pantallas sin mouse */
    .touch {
      display: none;
      width: 100%;
      max-width: 960px;
      justify-content: space-between;
      gap: 12px;
    }

    .touch .group { display: flex; gap: 12px; }

    .touch button {
      width: 76px;
      height: 76px;
      border: 0;
      border-radius: 50%;
      background: #34507a;
      color: #f6ead6;
      font-size: 28px;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch button.jump { background: #e07b39; width: 92px; height: 92px; }
    .touch button:active, .touch button.on { filter: brightness(1.3); transform: scale(0.96); }

    @media (hover: none) {
      .touch { display: flex; }
      .help { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" aria-label="Clarita busca a Any"></canvas>

  <p class="help">Mover: ← → o A D &nbsp;|&nbsp; Saltar: Espacio, ↑ o W (mantén para saltar más alto) &nbsp;|&nbsp; Reiniciar: Enter</p>

  <div class="touch">
    <div class="group">
      <button id="btnLeft" aria-label="Izquierda">◀</button>
      <button id="btnRight" aria-label="Derecha">▶</button>
    </div>
    <button id="btnJump" class="jump" aria-label="Saltar">▲</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
