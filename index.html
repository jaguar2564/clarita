
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Ajusta el juego a la pantalla del celular automáticamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clarita busca a Any</title>
    <style>
        /* Estilos globales */
        body {
            margin: 0;
            padding: 0;
            background-color: #231a1c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            color: #fff6e4;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Contenedor principal adaptable */
        #contenedor-principal {
            width: 100%;
            max-width: 960px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* El canvas se escala manteniendo proporciones */
        canvas#game {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
        }

        /* ---- CONTROLES TÁCTILES VISIBLES PARA EL CELULAR ---- */
        .pad-digital {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            margin-top: 10px;
        }

        .cruceta-direcciones {
            display: flex;
            gap: 15px;
        }

        /* Diseño de los botones de juego */
        .btn-mando {
            width: 65px;
            height: 65px;
            font-size: 24px;
            font-weight: bold;
            color: #fff6e4;
            background: #3b3f4c;
            border: 3px solid #fff6e4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none; /* Evita que el celular haga zoom al tocar rápido */
            transition: background 0.1s, transform 0.1s;
        }

        /* Efecto visual al mantenerlos presionados en el celular */
        .btn-mando:active, .btn-mando.on {
            background: #f2b01e;
            color: #231a1c;
            transform: scale(0.92);
        }

        .btn-salto-contenedor {
            display: flex;
            align-items: center;
        }

        #btnJump {
            background: #d9382b; /* Color rojo para el botón de saltar */
            width: 75px;
            height: 75px;
        }

        /* ---- MENÚ INFERIOR DE SELECCIÓN DE NIVELES ---- */
        .menu-niveles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-nivel {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-activo {
            background-color: #f2b01e;
            color: #231a1c;
        }

        .btn-bloqueado {
            background-color: #4a4f5c;
            color: #8f98a3;
            cursor: not-allowed;
        }

        /* Infraestructuras multimedia requeridas por menu.js */
        #video-intro {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #pantalla-final {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="contenedor-principal">
        
        <!-- Elementos del video introductorio -->
        <div id="video-intro">
            <video id="videoIntro" width="100%" height="auto"></video>
            <button id="btnPlayIntro" class="btn-nivel btn-activo">▶ Reproducir Intro</button>
            <button id="btnSkipIntro" class="btn-nivel btn-activo" style="display:none;">Saltar ⏭</button>
        </div>

        <!-- Elementos de la pantalla final -->
        <div id="pantalla-final">
            <canvas id="fuegos" width="960" height="540"></canvas>
            <button id="btnReiniciar">¿Quieres comenzar de nuevo?</button>
            <button id="btnFin">Fin</button>
        </div>

        <!-- Pantalla de renderizado del juego (Canvas) -->
        <canvas id="game" width="960" height="540"></canvas>

        <!-- CONTROLES DIGITALES VISIBLES PARA EL TELÉFONO -->
        <div class="pad-digital">
            <div class="cruceta-direcciones">
                <!-- Botón Izquierda -->
                <button id="btnLeft" class="btn-mando">◀</button>
                <!-- Botón Derecha -->
                <button id="btnRight" class="btn-mando">▶</button>
            </div>
            <div class="btn-salto-contenedor">
                <!-- Botón Saltar -->
                <button id="btnJump" class="btn-mando">▲</button>
            </div>
        </div>

        <!-- Bloque inferior de selección y progreso de niveles -->
        <div class="menu-niveles">
            <button id="btnNivel1" class="btn-nivel"></button>
            <button id="btnNivel2" class="btn-nivel"></button>
            <button id="btnNivel3" class="btn-nivel"></button>
            <button id="btnNivel4" class="btn-nivel"></button>
        </div>

    </div>

    <!-- Ejecución del núcleo del juego -->
    <script src="menu.js"></script>

</body>
</html>
